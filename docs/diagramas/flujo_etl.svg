<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1500" viewBox="0 0 1400 1500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1400" height="1500" fill="#ffffff"/>
  <text x="700" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Diagrama de Flujo del Proceso ETL</text>
  <text x="700" y="72" text-anchor="middle" font-size="16" fill="#475569">Fase de Extracción implementada en ETL.Worker · las fases T y L se muestran como continuidad</text>

  <g font-size="15" text-anchor="middle">
  <!-- Inicio -->
  <rect x="580" y="100" width="240" height="54" rx="27" fill="#16a34a"/>
  <text x="700" y="133" fill="#fff" font-weight="700">INICIO · Worker Service</text>
  <line x1="700" y1="154" x2="700" y2="184" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <rect x="500" y="186" width="400" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="700" y="215" font-weight="700" fill="#3b0764">Cargar configuración</text>
  <text x="700" y="238" font-size="13" fill="#4c1d95">appsettings.json + User Secrets · validar opciones (ValidateOnStart)</text>
  <line x1="700" y1="256" x2="700" y2="286" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <rect x="500" y="288" width="400" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="700" y="317" font-weight="700" fill="#3b0764">Registrar extractores habilitados</text>
  <text x="700" y="340" font-size="13" fill="#4c1d95">Generar LoteId · iniciar Stopwatch total</text>
  <line x1="700" y1="358" x2="700" y2="388" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Fork bar -->
  <rect x="190" y="390" width="1020" height="10" rx="3" fill="#334155"/>
  <text x="1220" y="400" font-size="13" text-anchor="start" fill="#334155">Parallel.ForEachAsync</text>
  <line x1="350" y1="400" x2="350" y2="428" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="400" x2="700" y2="428" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1050" y1="400" x2="1050" y2="428" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Lanes -->
  <rect x="200" y="430" width="300" height="56" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="350" y="463" font-weight="700" fill="#065f46">CsvExtractor</text>
  <rect x="550" y="430" width="300" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="700" y="463" font-weight="700" fill="#1e3a8a">DatabaseExtractor</text>
  <rect x="900" y="430" width="300" height="56" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="1050" y="463" font-weight="700" fill="#7c2d12">ApiExtractor</text>

  <line x1="350" y1="486" x2="350" y2="510" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="486" x2="700" y2="510" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1050" y1="486" x2="1050" y2="510" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <rect x="200" y="512" width="300" height="56" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="350" y="537" font-size="14" fill="#0f172a">Limpiar staging de la fuente</text>
  <text x="350" y="556" font-size="12" fill="#64748b">DELETE … WHERE NombreFuente</text>
  <rect x="550" y="512" width="300" height="56" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="700" y="537" font-size="14" fill="#0f172a">Limpiar staging de la fuente</text>
  <text x="700" y="556" font-size="12" fill="#64748b">DELETE … WHERE NombreFuente</text>
  <rect x="900" y="512" width="300" height="56" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="1050" y="537" font-size="14" fill="#0f172a">Limpiar staging de la fuente</text>
  <text x="1050" y="556" font-size="12" fill="#64748b">DELETE … WHERE NombreFuente</text>

  <line x1="350" y1="568" x2="350" y2="592" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="568" x2="700" y2="592" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1050" y1="568" x2="1050" y2="592" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <rect x="200" y="594" width="300" height="76" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="350" y="620" font-size="14" fill="#0f172a">Abrir surveys_part1.csv (stream)</text>
  <text x="350" y="640" font-size="13" fill="#047857">Validar encabezado (CsvHelper)</text>
  <text x="350" y="658" font-size="13" fill="#047857">Leer fila por fila</text>
  <rect x="550" y="594" width="300" height="76" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="700" y="620" font-size="14" fill="#0f172a">Conectar a SistemaOpinionesClientes</text>
  <text x="700" y="640" font-size="13" fill="#1d4ed8">SELECT … WHERE CodigoOrigen=@p</text>
  <text x="700" y="658" font-size="13" fill="#1d4ed8">SqlDataReader secuencial</text>
  <rect x="900" y="594" width="300" height="76" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text x="1050" y="620" font-size="14" fill="#0f172a">GET /api/comentarios?pagina=n</text>
  <text x="1050" y="640" font-size="13" fill="#c2410c">Header X-Api-Key · reintentos</text>
  <text x="1050" y="658" font-size="13" fill="#c2410c">Repetir hasta TotalPaginas</text>

  <line x1="350" y1="670" x2="350" y2="694" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="670" x2="700" y2="694" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1050" y1="670" x2="1050" y2="694" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Validation diamonds -->
  <polygon points="350,696 470,746 350,796 230,746" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="350" y="743" font-size="14" fill="#713f12">¿Registro</text>
  <text x="350" y="761" font-size="14" fill="#713f12">válido?</text>
  <polygon points="700,696 820,746 700,796 580,746" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="700" y="743" font-size="14" fill="#713f12">¿Registro</text>
  <text x="700" y="761" font-size="14" fill="#713f12">válido?</text>
  <polygon points="1050,696 1170,746 1050,796 930,746" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="1050" y="743" font-size="14" fill="#713f12">¿Registro</text>
  <text x="1050" y="761" font-size="14" fill="#713f12">válido?</text>

  <!-- No branches -->
  <line x1="470" y1="746" x2="484" y2="746" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="476" y="738" font-size="12" fill="#dc2626">No</text>
  <rect x="486" y="724" width="74" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="523" y="742" font-size="11" fill="#991b1b">Rechazado</text>
  <text x="523" y="758" font-size="11" fill="#991b1b">LogWarning</text>
  <line x1="820" y1="746" x2="834" y2="746" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="826" y="738" font-size="12" fill="#dc2626">No</text>
  <rect x="836" y="724" width="74" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="873" y="742" font-size="11" fill="#991b1b">Rechazado</text>
  <text x="873" y="758" font-size="11" fill="#991b1b">LogWarning</text>
  <line x1="1170" y1="746" x2="1184" y2="746" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="1176" y="738" font-size="12" fill="#dc2626">No</text>
  <rect x="1186" y="724" width="74" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1223" y="742" font-size="11" fill="#991b1b">Rechazado</text>
  <text x="1223" y="758" font-size="11" fill="#991b1b">LogWarning</text>

  <!-- Yes -> join to OpinionExtraida -->
  <line x1="350" y1="796" x2="350" y2="880" stroke="#16a34a" stroke-width="2"/>
  <text x="362" y="826" font-size="13" text-anchor="start" fill="#16a34a">Sí</text>
  <line x1="700" y1="796" x2="700" y2="880" stroke="#16a34a" stroke-width="2"/>
  <text x="712" y="826" font-size="13" text-anchor="start" fill="#16a34a">Sí</text>
  <line x1="1050" y1="796" x2="1050" y2="880" stroke="#16a34a" stroke-width="2"/>
  <text x="1062" y="826" font-size="13" text-anchor="start" fill="#16a34a">Sí</text>
  <line x1="350" y1="880" x2="1050" y2="880" stroke="#16a34a" stroke-width="2"/>
  <line x1="700" y1="880" x2="700" y2="904" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="480" y="906" width="440" height="60" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="2"/>
  <text x="700" y="932" font-weight="700" fill="#713f12">Mapear a OpinionExtraida</text>
  <text x="700" y="952" font-size="13" fill="#854d0e">yield return (IAsyncEnumerable) → buffer del orquestador</text>
  <line x1="700" y1="966" x2="700" y2="990" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <polygon points="700,992 840,1040 700,1088 560,1040" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="700" y="1036" font-size="14" fill="#713f12">¿Buffer = 500 o</text>
  <text x="700" y="1054" font-size="14" fill="#713f12">fin de la fuente?</text>
  <line x1="560" y1="1040" x2="440" y2="1040" stroke="#334155" stroke-width="2"/>
  <text x="505" y="1032" font-size="13" fill="#334155">No</text>
  <line x1="440" y1="1040" x2="440" y2="936" stroke="#334155" stroke-width="2"/>
  <line x1="440" y1="936" x2="478" y2="936" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="420" y="990" font-size="12" fill="#334155" transform="rotate(-90 420 990)">siguiente registro</text>
  <line x1="700" y1="1088" x2="700" y2="1112" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="712" y="1104" font-size="13" text-anchor="start" fill="#16a34a">Sí</text>

  <rect x="480" y="1114" width="440" height="60" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="700" y="1140" font-weight="700" fill="#164e63">SqlBulkCopy → stg.Opiniones</text>
  <text x="700" y="1160" font-size="13" fill="#155e75">BD analítica SistemaOpinionesAnalitica</text>
  <line x1="700" y1="1174" x2="700" y2="1198" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <rect x="480" y="1200" width="440" height="60" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="700" y="1226" font-weight="700" fill="#164e63">Registrar stg.ControlExtraccion</text>
  <text x="700" y="1246" font-size="13" fill="#155e75">duración (Stopwatch), extraídos, rechazados, estado, error</text>
  <line x1="700" y1="1260" x2="700" y2="1284" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- error box -->
  <rect x="1010" y="1114" width="330" height="86" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1175" y="1140" font-size="14" font-weight="700" fill="#991b1b">Excepción en una fuente</text>
  <text x="1175" y="1160" font-size="13" fill="#991b1b">LogError · Estado = Fallido</text>
  <text x="1175" y="1180" font-size="13" fill="#991b1b">las demás fuentes continúan</text>
  <line x1="1010" y1="1180" x2="922" y2="1222" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#a)"/>

  <rect x="480" y="1286" width="440" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="700" y="1312" font-weight="700" fill="#3b0764">Resumen por fuente en logs</text>
  <text x="700" y="1331" font-size="13" fill="#4c1d95">consola + logs/etl-extraccion-*.log</text>
  <line x1="700" y1="1342" x2="700" y2="1366" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <polygon points="700,1368 830,1408 700,1448 570,1408" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="700" y="1405" font-size="14" fill="#713f12">¿IntervaloMinutos</text>
  <text x="700" y="1423" font-size="14" fill="#713f12">&gt; 0?</text>
  <line x1="830" y1="1408" x2="960" y2="1408" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="880" y="1400" font-size="13" fill="#334155">No</text>
  <rect x="962" y="1382" width="200" height="52" rx="26" fill="#dc2626"/>
  <text x="1062" y="1413" fill="#fff" font-weight="700">FIN (StopApplication)</text>
  <line x1="570" y1="1408" x2="60" y2="1408" stroke="#334155" stroke-width="2"/>
  <text x="520" y="1400" font-size="13" fill="#334155">Sí: esperar N min</text>
  <line x1="60" y1="1408" x2="60" y2="323" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="323" x2="498" y2="323" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Next phases -->
  <rect x="1180" y="1260" width="200" height="110" rx="8" fill="#fff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="1280" y="1288" font-size="14" font-weight="700" fill="#64748b">Fases siguientes</text>
  <text x="1280" y="1312" font-size="13" fill="#64748b">T: limpiar / normalizar</text>
  <text x="1280" y="1334" font-size="13" fill="#64748b">L: cargar Data Warehouse</text>
  <text x="1280" y="1356" font-size="13" fill="#64748b">Dashboard Power BI</text>
  </g>
</svg>
